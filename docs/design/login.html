<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — JuggleMate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');

:root {
  --bg-root: oklch(0.16 0.008 260);
  --bg-surface: oklch(0.19 0.008 260);
  --bg-elevated: oklch(0.22 0.008 260);
  --bg-hover: oklch(0.24 0.010 260);
  --bg-active: oklch(0.27 0.012 250);
  --text-primary: oklch(0.92 0.004 260);
  --text-secondary: oklch(0.65 0.008 260);
  --text-tertiary: oklch(0.45 0.008 260);
  --border-subtle: oklch(0.26 0.006 260);
  --border-default: oklch(0.30 0.008 260);
  --accent: oklch(0.68 0.18 250);
  --accent-dim: oklch(0.55 0.14 250);
  --accent-bg: oklch(0.25 0.06 250);
  --danger: oklch(0.65 0.21 20);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.4);
  --shadow-lg: 0 8px 30px oklch(0 0 0 / 0.5);
  --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition-fast: 120ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 250ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg-root);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Page Layout */
.login-page {
  min-height: 100vh;
  display: flex;
}

.login-page__aside {
  flex: 1;
  background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-root) 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 40px;
  position: relative;
  overflow: hidden;
}

.login-page__aside::before {
  content: '';
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, oklch(0.30 0.12 250 / 0.15) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: float 8s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.8; }
}

.login-page__brand {
  position: relative;
  z-index: 1;
  text-align: center;
}

.login-page__logo {
    width: 90px;
    height: 90px;
    background: url(/logo.png) center / contain no-repeat;
    margin: 0 auto 0px;
}

.login-page__logo-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 12px white;
}

.login-page__aside-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}

.login-page__aside-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  max-width: 340px;
  line-height: 1.6;
}

.login-page__features {
  margin-top: 48px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.login-page__feature {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
  color: var(--text-secondary);
}

.login-page__feature-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.login-page__form-side {
  width: 480px;
  min-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 48px;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
}

/* Login Card */
.login-card {
  width: 100%;
  max-width: 360px;
}

.login-card__header {
  text-align: center;
  margin-bottom: 32px;
}

.login-card__title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}

.login-card__subtitle {
  font-size: 14px;
  color: var(--text-secondary);
}

/* Form */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.form-input-wrapper {
  position: relative;
}

.form-input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text-tertiary);
  pointer-events: none;
  transition: color var(--transition-fast);
}

.form-input {
  width: 100%;
  padding: 12px 14px;
  padding-left: 44px;
  background: var(--bg-root);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.form-input::placeholder { color: var(--text-tertiary); }

.form-input:focus {
  border-color: var(--accent-dim);
  box-shadow: 0 0 0 3px oklch(0.4 0.12 250 / 0.15);
}

.form-input:focus + .form-input-icon,
.form-input-wrapper:focus-within .form-input-icon {
  color: var(--accent);
}

.form-input.error {
  border-color: var(--danger);
  box-shadow: 0 0 0 3px oklch(0.55 0.15 20 / 0.15);
}

.form-error {
  font-size: 12px;
  color: var(--danger);
  margin-top: 6px;
  display: none;
}

.form-error.visible {
  display: block;
}

.form-input-wrapper--password {
  display: flex;
}

.form-input-wrapper--password .form-input {
  padding-right: 44px;
}

.password-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  font-size: 16px;
  padding: 0;
  transition: color var(--transition-fast);
}

.password-toggle:hover {
  color: var(--text-secondary);
}

/* Row with checkbox and link */
.form-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

/* Custom Checkbox */
.checkbox-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.checkbox-wrapper input {
  display: none;
}

.checkbox-custom {
  width: 18px;
  height: 18px;
  border: 1px solid var(--border-default);
  border-radius: 4px;
  background: var(--bg-root);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.checkbox-wrapper:hover .checkbox-custom {
  border-color: var(--accent-dim);
}

.checkbox-wrapper input:checked + .checkbox-custom {
  background: var(--accent);
  border-color: var(--accent);
}

.checkbox-custom::after {
  content: '✓';
  font-size: 11px;
  color: var(--bg-root);
  font-weight: 700;
  opacity: 0;
  transform: scale(0.5);
  transition: all var(--transition-fast);
}

.checkbox-wrapper input:checked + .checkbox-custom::after {
  opacity: 1;
  transform: scale(1);
}

.checkbox-label {
  font-size: 13px;
  color: var(--text-secondary);
}

.form-link {
  font-size: 13px;
  color: var(--accent);
  text-decoration: none;
  transition: color var(--transition-fast);
}

.form-link:hover {
  color: oklch(0.75 0.18 250);
  text-decoration: underline;
}

/* Primary Button */
.btn {
  width: 100%;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: var(--font-sans);
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary {
  background: var(--accent);
  color: var(--bg-root);
}

.btn-primary:hover {
  background: oklch(0.72 0.18 250);
  transform: scale(1.02);
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn__spinner {
  width: 16px;
  height: 16px;
  border: 2px solid oklch(0 0 0 / 0.2);
  border-top-color: var(--bg-root);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: none;
}

.btn-primary.loading .btn__spinner {
  display: block;
}

.btn-primary.loading .btn__text {
  opacity: 0.7;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 24px 0;
}

.divider__line {
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
}

.divider__text {
  font-size: 12px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Social Login */
.social-login {
  display: flex;
  gap: 12px;
}

.btn-social {
  flex: 1;
  padding: 10px 16px;
  background: var(--bg-root);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-sans);
}

.btn-social:hover {
  background: var(--bg-hover);
  border-color: var(--border-default);
}

.btn-social svg {
  width: 18px;
  height: 18px;
}

/* Sign Up CTA */
.signup-cta {
  text-align: center;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border-subtle);
}

.signup-cta__text {
  font-size: 14px;
  color: var(--text-secondary);
}

.signup-cta__link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  transition: color var(--transition-fast);
}

.signup-cta__link:hover {
  color: oklch(0.75 0.18 250);
  text-decoration: underline;
}

/* Responsive */
@media (max-width: 900px) {
  .login-page {
    flex-direction: column;
  }

  .login-page__aside {
    padding: 48px 24px;
    min-height: auto;
  }

  .login-page__aside::before {
    width: 300px;
    height: 300px;
  }

  .login-page__features {
    display: none;
  }

  .login-page__form-side {
    width: 100%;
    min-width: unset;
    border-left: none;
    border-top: 1px solid var(--border-subtle);
    padding: 40px 24px;
  }

  .login-card {
    max-width: 100%;
  }
}
</style>
</head>
<body>

<div class="login-page">
  <!-- Left: Brand Panel -->
  <aside class="login-page__aside">
    <div class="login-page__brand">
      <div class="login-page__logo">
        <div class="login-page__logo-dot"></div>
      </div>
      <h1 class="login-page__aside-title">JuggleMate</h1>
      <p class="login-page__aside-subtitle">一个窗口，管理所有平台的对话；一个面板，调度所有 AI 助手</p>
    </div>

    <div class="login-page__features">
      <div class="login-page__feature">
        <div class="login-page__feature-icon">💬</div>
        <span>聚合多平台私信，统一管理</span>
      </div>
      <div class="login-page__feature">
        <div class="login-page__feature-icon">🤖</div>
        <span>AI Agent 实时回复建议</span>
      </div>
      <div class="login-page__feature">
        <div class="login-page__feature-icon">⚡</div>
        <span>一键接管，自动回复</span>
      </div>
    </div>
  </aside>

  <!-- Right: Login Form -->
  <main class="login-page__form-side">
    <div class="login-card">
      <div class="login-card__header">
        <h2 class="login-card__title">欢迎回来</h2>
        <p class="login-card__subtitle">请登录您的 JuggleMate 账号</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">邮箱</label>
          <div class="form-input-wrapper">
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
            <span class="form-input-icon">📧</span>
          </div>
          <div class="form-error" id="emailError">请输入有效的邮箱地址</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="form-input-wrapper form-input-wrapper--password">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="输入密码"
              autocomplete="current-password"
              required
            >
            <span class="form-input-icon">🔒</span>
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="切换密码可见性">👁</button>
          </div>
          <div class="form-error" id="passwordError">密码至少 8 个字符</div>
        </div>

        <div class="form-row">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="remember">
            <span class="checkbox-custom"></span>
            <span class="checkbox-label">记住我</span>
          </label>
          <a href="#" class="form-link">忘记密码？</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="btn__spinner"></span>
          <span class="btn__text">登录</span>
        </button>
      </form>

      <div class="divider">
        <span class="divider__line"></span>
        <span class="divider__text">或继续使用</span>
        <span class="divider__line"></span>
      </div>

      <div class="social-login">
        <button type="button" class="btn-social" onclick="socialLogin('google')">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social" onclick="socialLogin('github')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </button>
        <button type="button" class="btn-social" onclick="socialLogin('apple')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Apple
        </button>
      </div>

      <div class="signup-cta">
        <span class="signup-cta__text">还没有账号？</span>
        <a href="#" class="signup-cta__link">立即注册</a>
      </div>
    </div>
  </main>
</div>

<script>
function togglePassword() {
  const input = document.getElementById('password');
  const btn = document.querySelector('.password-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validateForm() {
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  let valid = true;

  // Reset errors
  email.classList.remove('error');
  password.classList.remove('error');
  emailError.classList.remove('visible');
  passwordError.classList.remove('visible');

  // Email validation
  if (!validateEmail(email.value)) {
    email.classList.add('error');
    emailError.classList.add('visible');
    valid = false;
  }

  // Password validation
  if (password.value.length < 8) {
    password.classList.add('error');
    passwordError.classList.add('visible');
    valid = false;
  }

  return valid;
}

// Real-time validation on blur
document.getElementById('email').addEventListener('blur', function() {
  if (this.value && !validateEmail(this.value)) {
    this.classList.add('error');
    document.getElementById('emailError').classList.add('visible');
  } else {
    this.classList.remove('error');
    document.getElementById('emailError').classList.remove('visible');
  }
});

document.getElementById('password').addEventListener('blur', function() {
  if (this.value && this.value.length < 8) {
    this.classList.add('error');
    document.getElementById('passwordError').classList.add('visible');
  } else {
    this.classList.remove('error');
    document.getElementById('passwordError').classList.remove('visible');
  }
});

function handleLogin(e) {
  e.preventDefault();

  if (!validateForm()) return;

  const btn = document.getElementById('loginBtn');
  btn.classList.add('loading');
  btn.disabled = true;

  // Simulate login request
  setTimeout(() => {
    btn.classList.remove('loading');
    btn.disabled = false;
    alert('登录功能演示完成，实际项目中将连接后端 API');
  }, 1500);
}

function socialLogin(provider) {
  alert(`${provider} 登录功能演示，实际项目中将调用OAuth授权`);
}
</script>

</body>
</html>
