<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>JuggleMate</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* background: #0F172A; */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #475569;
    overflow: hidden;
    user-select: none;
  }
  .splash {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .logo {
    width: 192px;
    height: 192px;
    animation: float 2.4s ease-in-out infinite;
    filter: drop-shadow(0 12px 32px rgba(0, 128, 255, 0.35));
  }
  .brand {
    font-size: 18px;
    letter-spacing: 6px;
    font-weight: 600;
    color: #94A3B8;
    /* text-transform: uppercase; */
  }
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #0080FF;
    opacity: 0.3;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }
</style>
</head>
<body>
  <div class="splash">
    <img class="logo" src="./assets/splash-logo.png" alt="JuggleMate" draggable="false">
    <div class="brand">JuggleMate</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
